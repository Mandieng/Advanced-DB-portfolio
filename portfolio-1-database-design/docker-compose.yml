services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ride-hailing-portfolio-db:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ride_hailing}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Local-only binding; change only if remote exposure is intentional and secured.
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - ride_hailing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ride_hailing_data:
